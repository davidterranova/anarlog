# Homelab fork only: builds the three images the k3s deployment runs
# (davidterranova/local-k3s apps/anarlog/). linux/amd64 only: everything is
# pinned to the amd64 node. Tags: the commit SHA (what manifests pin) and
# `homelab` (latest build of this branch).
name: homelab-images

on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/davidterranova

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anarlog-api
            file: apps/api/Dockerfile
            target: runtime
          - name: anarlog-migrations
            file: scripts/homelab/docker/migrations.Dockerfile
            target: ""
          - name: anarlog-web
            file: scripts/homelab/docker/web.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:homelab
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Only the web image uses these (Vite inlines them at build time).
          build-args: |
            VITE_APP_URL=${{ vars.HOMELAB_APP_URL }}
            VITE_API_URL=${{ vars.HOMELAB_API_URL }}
            VITE_SUPABASE_URL=${{ vars.HOMELAB_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.HOMELAB_SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=homelab-${{ github.sha }}
